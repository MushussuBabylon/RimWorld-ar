# Manually-triggered translation check. Shows up under the "Actions" tab as
# "Check Arabic Translation" — click "Run workflow" whenever you want to
# validate the translation. It never creates a release, zip, or NexusMods
# upload, so you can run it as often as you like.

name: Check Arabic Translation

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  check-translation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build translation (dry run — no zip, no release, no upload)
        run: npm run build

      - name: Validate translation files
        run: node Scripts/check.ts
