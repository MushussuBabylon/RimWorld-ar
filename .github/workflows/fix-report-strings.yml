# One-click cleanup. Run it from the Actions tab ("Fix reportString periods")
# and it will strip the trailing period from every reportString value under
# Data/, then open a pull request with the change instead of committing
# straight to master — so you can review the diff before merging. Run the
# "Check Arabic Translation" workflow after merging to confirm the 342
# issues are gone.

name: Fix reportString periods

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  fix-report-strings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'

      - name: Run fixer
        run: node Scripts/fix-report-strings.ts

      - name: Open pull request with fixes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          BRANCH="fix-report-string-periods-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add Data
          git commit -m "Remove trailing periods from reportString values"
          git push origin "$BRANCH"

          gh pr create \
            --title "Remove trailing periods from reportString values" \
            --body "Automated fix from the 'Fix reportString periods' workflow. Removes the trailing period from every \`reportString\` value under \`Data/\` so RimWorld doesn't double up punctuation when it appends its own text." \
            --base master \
            --head "$BRANCH"
